name: Update and deploy

on:
  schedule:
    - cron: '0 23 * * *'   # prepare tomorrow's country ahead of midnight UTC
    - cron: '15 0,6,12,18 * * *'   # refresh today's headlines
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build data
        if: github.event_name != 'push'
        run: node build.mjs
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data rotation.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F\ %H:%M)"
          # Someone may have pushed while the build ran; replay on top, keeping this run's data if both touched it.
          git pull --rebase -X theirs
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
